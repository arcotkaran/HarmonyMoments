<!-- ================================================================
     REVIEWS  (REAL Google reviews only — never invent testimonials.)

     Shared by the home page, the proposal page and every occasion page.
     To add one: copy a card, paste the real review verbatim into
     .review-quote, then add it to the JSON-LD in src/layout.html and
     bump reviewCount there and in each page's front-matter.

     .review-pull is the highlight line. It must be an unbroken phrase
     copied from the review itself — trimmed at the ends, never spliced
     or reworded. A one-line review is its own pull line and needs no
     body.

     .review-tag only where the review text itself names the occasion.
     Don't infer one.

     Newest first. The cards sit in a horizontal rail, so more reviews
     cost no extra page height.
     ================================================================ -->
